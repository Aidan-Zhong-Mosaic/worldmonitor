apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "worldmonitor.componentFullname" (list . "redis-data") }}
  labels:
    {{- include "worldmonitor.componentLabels" (list . "redis") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.redis.persistence.accessMode }}
  {{- if .Values.redis.persistence.storageClassName }}
  storageClassName: {{ .Values.redis.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
