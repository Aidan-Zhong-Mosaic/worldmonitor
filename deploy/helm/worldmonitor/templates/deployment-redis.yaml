apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worldmonitor.componentFullname" (list . "redis") }}
  labels:
    {{- include "worldmonitor.componentLabels" (list . "redis") | nindent 4 }}
spec:
  # Always 1: single ReadWriteOnce data volume, no clustering - this mirrors
  # docker-compose.yml's single `redis` container, not a scaled tier.
  # Recreate so a redeploy doesn't try to attach the same RWO volume twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "worldmonitor.componentSelectorLabels" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worldmonitor.componentSelectorLabels" (list . "redis") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "worldmonitor.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # --requirepass closes off the network so anything else that ends
          # up in this namespace can't read/write cache entries without the
          # password - same reasoning as the original docker-compose.yml.
          command:
            - sh
            - -c
            - >-
              exec redis-server
              --requirepass "$REDIS_PASSWORD"
              --maxmemory {{ .Values.redis.maxMemory }}
              --maxmemory-policy {{ .Values.redis.maxMemoryPolicy }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worldmonitor.secretName" . }}
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "worldmonitor.componentFullname" (list . "redis-data") }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
