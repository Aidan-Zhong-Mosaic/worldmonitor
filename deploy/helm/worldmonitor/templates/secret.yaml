{{/*
Only rendered for the dev/quick-start path (secrets.create: true). In real
environments, pre-create the Secret out-of-band and set secrets.existingSecret
instead - see README-deploy.md.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worldmonitor.secretName" . }}
  labels:
    {{- include "worldmonitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
