# Mosaic/LibreChat embed allowlist.
#
# Additional origins permitted to embed the full WorldMonitor dashboard via
# iframe (CSP `frame-ancestors`). Kept in its own file so new embedder
# origins can be added here without editing the long CSP strings in
# nginx.conf / nginx-security-headers.conf directly.
#
# NOTE: vercel.json has no include mechanism for static header config, so its
# frame-ancestors list must still be updated by hand to stay in sync with
# this file if/when the Vercel-hosted deployment also needs these origins.
#
# Format: space-separated list of exact scheme://host[:port] origins.
# Do not use a wildcard here — this allowlist applies to the authenticated
# dashboard, not the public /embed surface (which intentionally allows any
# origin via a separate, capability-locked-down CSP).
set $mosaic_frame_ancestors "http://34.245.19.25:3080 https://ai.mosaicinsurance.com";
